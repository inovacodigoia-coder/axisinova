    <!-- Schema: FAQPage (para rich snippets no Google) -->

    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "O Axis Inova funciona para laboratórios clínicos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O Axis Inova possui módulo completo para laboratórios, incluindo catálogo de exames, fila de coleta, digitação de resultados, laudos com assinatura digital e portais para parceiros e médicos."
          }
        },
        {
          "@type": "Question",
          "name": "O sistema emite laudos e faz faturamento TISS?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O Axis Inova gera laudos com assinatura digital, exporta arquivos XML TISS para convênios e gerencia guias SADT conforme as normas da ANS."
          }
        },
        {
          "@type": "Question",
          "name": "Posso usar em múltiplas unidades?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O sistema é multi-unidades com controle de origens, usuários por unidade, permissões granulares e painéis de TV e totem independentes por unidade."
          }
        },
        {
          "@type": "Question",
          "name": "Tem período de teste gratuito?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O Axis Inova oferece 14 dias de teste gratuito sem necessidade de cartão de crédito."
          }
        },
        {
          "@type": "Question",
          "name": "O sistema possui prontuário eletrônico?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O Axis Inova inclui prontuário eletrônico completo com linha do tempo do paciente, prescrições, diagnósticos por CID-10 e solicitação de exames."
          }
        }
      ]
    }
